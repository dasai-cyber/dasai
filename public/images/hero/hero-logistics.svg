<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2C59" />
      <stop offset="50%" stop-color="#0B1C38" />
      <stop offset="100%" stop-color="#050E1E" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C29A" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Tech Logistics Scene Container -->
  <rect width="900" height="650" rx="32" fill="url(#bgGlow)" />
  
  <!-- Subtle Route Grid / Iso Grid -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="100" x2="900" y2="100" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="0" y1="300" x2="900" y2="300" />
    <line x1="0" y1="400" x2="900" y2="400" />
    <line x1="0" y1="500" x2="900" y2="500" />
    <line x1="150" y1="0" x2="150" y2="650" />
    <line x1="300" y1="0" x2="300" y2="650" />
    <line x1="450" y1="0" x2="450" y2="650" />
    <line x1="600" y1="0" x2="600" y2="650" />
    <line x1="750" y1="0" x2="750" y2="650" />
  </g>

  <!-- Glowing Kinetic Route Path -->
  <path d="M120 480 Q 280 430, 380 320 T 640 240 T 820 160" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-dasharray="10 6" opacity="0.8" filter="url(#glowEffect)" />
  <path d="M180 540 Q 360 480, 520 400 T 780 310" fill="none" stroke="url(#neonOrange)" stroke-width="3" opacity="0.7" />

  <!-- Logistics Hub Nodes -->
  <g transform="translate(120, 480)">
    <circle cx="0" cy="0" r="16" fill="#00C29A" fill-opacity="0.2" />
    <circle cx="0" cy="0" r="8" fill="#00C29A" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
  </g>
  <g transform="translate(380, 320)">
    <circle cx="0" cy="0" r="20" fill="#FF6B00" fill-opacity="0.25" />
    <circle cx="0" cy="0" r="9" fill="#FF6B00" />
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
  </g>
  <g transform="translate(640, 240)">
    <circle cx="0" cy="0" r="14" fill="#38BDF8" fill-opacity="0.2" />
    <circle cx="0" cy="0" r="7" fill="#38BDF8" />
  </g>
  <g transform="translate(820, 160)">
    <circle cx="0" cy="0" r="22" fill="#00C29A" fill-opacity="0.3" />
    <circle cx="0" cy="0" r="10" fill="#00C29A" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- Main Logistics Truck (Right Isometric View) -->
  <g transform="translate(240, 260)">
    <!-- Shadow -->
    <ellipse cx="260" cy="240" rx="220" ry="24" fill="#000000" opacity="0.6" />
    
    <!-- Truck Box Cargo -->
    <path d="M140 60 L420 40 L420 180 L140 200 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M420 40 L490 85 L490 220 L420 180 Z" fill="#CBD5E1" />
    
    <!-- Corporate Livery on Side Box -->
    <path d="M140 100 L420 80 L420 140 L140 160 Z" fill="#0F2C59" />
    <path d="M140 140 L420 120 L420 150 L140 170 Z" fill="url(#neonOrange)" />
    
    <text x="170" y="132" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">DASAI</text>
    <text x="275" y="130" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#00C29A">LOGÍSTICA</text>

    <!-- Cabin (Front Heavy Modern) -->
    <path d="M30 140 L140 120 L140 210 L30 210 Z" fill="#0F2C59" stroke="#081B38" />
    <path d="M45 138 L135 122 L135 165 L45 165 Z" fill="#38BDF8" opacity="0.85" />
    <!-- Windshield Reflection -->
    <path d="M60 140 L125 128 L125 160 L60 160 Z" fill="#BAE6FD" opacity="0.7" />

    <!-- Headlights Beam Glow -->
    <polygon points="30,190 -80,240 -80,210 30,180" fill="url(#neonCyan)" opacity="0.35" />

    <!-- Wheels -->
    <circle cx="85" cy="215" r="28" fill="#0F172A" stroke="#334155" stroke-width="4" />
    <circle cx="85" cy="215" r="14" fill="#64748B" />
    <circle cx="200" cy="210" r="28" fill="#0F172A" stroke="#334155" stroke-width="4" />
    <circle cx="200" cy="210" r="14" fill="#64748B" />
    <circle cx="360" cy="195" r="28" fill="#0F172A" stroke="#334155" stroke-width="4" />
    <circle cx="360" cy="195" r="14" fill="#64748B" />
    <circle cx="410" cy="190" r="28" fill="#0F172A" stroke="#334155" stroke-width="4" />
    <circle cx="410" cy="190" r="14" fill="#64748B" />
  </g>

  <!-- Express Van (Front Right) -->
  <g transform="translate(60, 360)">
    <ellipse cx="140" cy="160" rx="110" ry="14" fill="#000000" opacity="0.5" />
    
    <!-- Van Body -->
    <path d="M20 90 L80 40 L210 40 L240 70 L240 140 L20 140 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <path d="M20 90 L80 40 L110 40 L110 140 L20 140 Z" fill="#0F2C59" />
    <path d="M40 50 L95 50 L95 85 L35 85 Z" fill="#38BDF8" opacity="0.9" />
    
    <!-- Van Livery -->
    <rect x="110" y="80" width="130" height="24" fill="#0F2C59" />
    <rect x="110" y="104" width="130" height="6" fill="#FF6B00" />
    <text x="120" y="97" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">DASAI EXPRESS</text>
    
    <!-- Van Wheels -->
    <circle cx="65" cy="140" r="20" fill="#0F172A" stroke="#475569" stroke-width="3" />
    <circle cx="65" cy="140" r="9" fill="#94A3B8" />
    <circle cx="195" cy="140" r="20" fill="#0F172A" stroke="#475569" stroke-width="3" />
    <circle cx="195" cy="140" r="9" fill="#94A3B8" />
  </g>

  <!-- Floating HUD Glass Cards -->
  <!-- HUD 1: OTIF Fulfillment -->
  <g transform="translate(50, 60)" filter="url(#glowEffect)">
    <rect width="210" height="84" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5" />
    <circle cx="34" cy="42" r="18" fill="#00C29A" fill-opacity="0.15" />
    <!-- Checkmark Icon -->
    <path d="M26 42 L32 48 L42 36" stroke="#00C29A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.5">NIVEL CUMPLIMIENTO</text>
    <text x="64" y="58" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">99.2% OTIF</text>
    <text x="64" y="72" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#00C29A">● Operación en vivo</text>
  </g>

  <!-- HUD 2: Live Tracking Active Dispatch -->
  <g transform="translate(630, 480)" filter="url(#glowEffect)">
    <rect width="220" height="96" rx="16" fill="url(#cardGrad)" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="34" cy="48" r="18" fill="#FF6B00" fill-opacity="0.15" />
    <!-- Pulse Radio Waves -->
    <circle cx="34" cy="48" r="8" fill="#FF6B00" />
    <text x="64" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FF8A3D">DESPACHO EN RUTA</text>
    <text x="64" y="54" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">ORDEN #DAS-8921</text>
    <text x="64" y="72" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Santiago → Viña del Mar</text>
    <text x="64" y="86" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#00C29A">Arribo estimado: 15:45</text>
  </g>

  <!-- HUD 3: GPS Telemetry -->
  <g transform="translate(560, 45)">
    <rect width="280" height="54" rx="14" fill="#0F2C59" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="28" cy="27" r="6" fill="#00C29A" />
    <text x="44" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">TELEMETRÍA SATELITAL 24/7</text>
    <text x="44" y="40" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#93C5FD">45 Vehículos conectados en simultáneo</text>
  </g>
</svg>
