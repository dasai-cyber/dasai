<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="specialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="specialCabin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#081B38" />
    </linearGradient>
    <filter id="specialShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F2C59" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="600" height="360" rx="24" fill="#F8FAFC" />
  <circle cx="490" cy="110" r="140" fill="#E2E8F0" opacity="0.4" />
  
  <!-- Road -->
  <ellipse cx="300" cy="310" rx="260" ry="18" fill="#0F2C59" opacity="0.2" />
  <path d="M40 310 L560 310" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="12 8" />

  <g filter="url(#specialShadow)">
    <!-- Chassis -->
    <rect x="130" y="246" width="370" height="14" rx="2" fill="#334155" />
    
    <!-- Thermo / Refrigeration Cargo Box -->
    <rect x="210" y="75" width="290" height="172" rx="6" fill="url(#specialGrad)" stroke="#CBD5E1" stroke-width="2" />
    
    <!-- Thermo-King Cooling Unit on Front Top of Box -->
    <rect x="195" y="80" width="30" height="40" rx="4" fill="#0F2C59" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="210" cy="100" r="8" fill="#38BDF8" opacity="0.8" />
    <text x="204" y="103" font-family="sans-serif" font-size="8" font-weight="900" fill="#FFFFFF">❄</text>

    <!-- Hydraulic Tail Lift (Rampa Hidráulica) in Rear -->
    <rect x="496" y="130" width="16" height="116" rx="2" fill="#F59E0B" stroke="#D97706" stroke-width="1.5" />
    <rect x="496" y="240" width="28" height="6" rx="1" fill="#475569" />

    <!-- Corporate Branding -->
    <rect x="230" y="130" width="250" height="42" fill="#0F2C59" />
    <rect x="230" y="172" width="250" height="8" fill="#00C29A" />
    <text x="245" y="158" font-family="system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">DASAI</text>
    <text x="330" y="158" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#38BDF8">FLOTA ESPECIAL</text>

    <!-- Cabin -->
    <path d="M100 246 L95 190 L115 125 L195 120 L200 246 Z" fill="url(#specialCabin)" stroke="#081B38" stroke-width="1.5" />
    <path d="M118 130 L190 126 L188 180 L106 180 Z" fill="#93C5FD" opacity="0.9" />
    
    <!-- Wheels -->
    <g transform="translate(155, 255)">
      <circle cx="0" cy="0" r="34" fill="#1E293B" />
      <circle cx="0" cy="0" r="22" fill="#64748B" />
      <circle cx="0" cy="0" r="12" fill="#CBD5E1" />
      <circle cx="0" cy="0" r="5" fill="#0F2C59" />
    </g>

    <g transform="translate(435, 255)">
      <circle cx="0" cy="0" r="36" fill="#1E293B" />
      <circle cx="0" cy="0" r="23" fill="#64748B" />
      <circle cx="0" cy="0" r="14" fill="#CBD5E1" />
      <circle cx="0" cy="0" r="6" fill="#0F2C59" />
    </g>
  </g>

  <!-- Badges -->
  <g transform="translate(40, 35)">
    <rect width="145" height="34" rx="8" fill="#0F2C59" />
    <text x="14" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">6.000 KG</text>
    <text x="75" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#93C5FD">| 28.0 m³</text>
  </g>
  <g transform="translate(385, 35)">
    <rect width="175" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="18" cy="17" r="5" fill="#38BDF8" />
    <text x="30" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F2C59">RAMPA HIDRÁULICA / FRÍO</text>
  </g>
</svg>
