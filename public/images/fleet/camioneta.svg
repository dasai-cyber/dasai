<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="vanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="cabinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#081B38" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F2C59" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background decorative badge -->
  <rect width="600" height="360" rx="24" fill="#F1F5F9" />
  <circle cx="480" cy="90" r="140" fill="#E2E8F0" opacity="0.5" />
  <circle cx="100" cy="270" r="80" fill="#00C29A" opacity="0.08" />

  <!-- Road / Shadow Line -->
  <ellipse cx="300" cy="305" rx="240" ry="18" fill="#0F2C59" opacity="0.18" />
  <path d="M60 305 L540 305" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="12 8" />

  <!-- Main Vehicle (Camioneta Urbana Express) -->
  <g filter="url(#shadow)">
    <!-- Vehicle Body Base -->
    <path d="M120 220 L150 140 L240 135 L330 135 L470 135 L495 190 L505 245 L475 250 L120 250 Z" fill="url(#vanGrad)" stroke="#CBD5E1" stroke-width="2" />
    
    <!-- Cabin Front -->
    <path d="M120 220 L150 140 L240 135 L240 250 L120 250 Z" fill="url(#cabinGrad)" />
    
    <!-- Windshield -->
    <path d="M152 145 L180 145 L225 145 L225 195 L140 195 Z" fill="url(#glassGrad)" />
    <!-- Side Window -->
    <path d="M185 148 L228 148 L228 190 L168 190 Z" fill="#BFDBFE" opacity="0.9" />
    <path d="M245 148 L320 148 L320 190 L245 190 Z" fill="url(#glassGrad)" opacity="0.8" />

    <!-- Rear Cargo Body -->
    <rect x="235" y="135" width="240" height="115" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    
    <!-- Corporate Livery on Cargo -->
    <rect x="235" y="185" width="240" height="24" fill="#0F2C59" />
    <rect x="235" y="209" width="240" height="6" fill="url(#accentGrad)" />
    <text x="250" y="202" font-family="system-ui, sans-serif" font-size="14" font-weight="900" letter-spacing="1" fill="#FFFFFF">DASAI EXPRESS</text>
    <text x="385" y="202" font-family="system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#00C29A">ÚLTIMA MILLA</text>

    <!-- Door Lines -->
    <line x1="235" y1="135" x2="235" y2="250" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="360" y1="135" x2="360" y2="250" stroke="#CBD5E1" stroke-width="1.5" />
    
    <!-- Door Handle -->
    <rect x="210" y="205" width="16" height="5" rx="2" fill="#475569" />
    <rect x="340" y="195" width="14" height="4" rx="2" fill="#94A3B8" />

    <!-- Front Headlight -->
    <path d="M120 220 L135 220 L135 235 L122 235 Z" fill="#FDE047" stroke="#EAB308" />
    <!-- Rear Taillight -->
    <rect x="470" y="190" width="8" height="26" rx="2" fill="#EF4444" />

    <!-- Front Bumper -->
    <rect x="110" y="235" width="24" height="18" rx="4" fill="#334155" />
    <!-- Rear Bumper -->
    <rect x="465" y="240" width="18" height="14" rx="3" fill="#334155" />

    <!-- Front Wheel -->
    <g transform="translate(180, 250)">
      <circle cx="0" cy="0" r="34" fill="#1E293B" />
      <circle cx="0" cy="0" r="22" fill="#64748B" />
      <circle cx="0" cy="0" r="14" fill="#CBD5E1" />
      <circle cx="0" cy="0" r="5" fill="#0F2C59" />
    </g>

    <!-- Rear Wheel -->
    <g transform="translate(415, 250)">
      <circle cx="0" cy="0" r="34" fill="#1E293B" />
      <circle cx="0" cy="0" r="22" fill="#64748B" />
      <circle cx="0" cy="0" r="14" fill="#CBD5E1" />
      <circle cx="0" cy="0" r="5" fill="#0F2C59" />
    </g>
  </g>

  <!-- Spec Badges Overlay -->
  <g transform="translate(40, 35)">
    <rect width="130" height="34" rx="8" fill="#0F2C59" />
    <text x="14" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">850 KG</text>
    <text x="70" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#93C5FD">| 3.5 m³</text>
  </g>
  <g transform="translate(420, 35)">
    <rect width="140" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="20" cy="17" r="5" fill="#00C29A" />
    <text x="32" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F2C59">GPS SATELITAL</text>
  </g>
</svg>
